</style></head><body><div class="app"><header class="top"><div class="brand">◈ Tactical Board 2.0<small>戰術教學繪圖板 · 非作戰系統</small></div><div class="grow"></div><button class="iconbtn" id="undo" title="復原">↶</button><button class="iconbtn" id="redo" title="重做">↷</button><button class="iconbtn" id="save" title="儲存">▣</button><button class="iconbtn" id="menu" title="更多">☰</button></header><main class="main"><div id="map"></div><div class="floating"><button class="iconbtn" id="plus" aria-label="放大">＋</button><button class="iconbtn" id="minus" aria-label="縮小">－</button><button class="iconbtn" id="finish" style="display:none" aria-label="完成繪製">✓</button><button class="iconbtn" id="cancel" style="display:none" aria-label="取消繪製">✕</button></div><div class="status"><span class="pill" id="mode">選取 · 點選圖形編輯</span><span class="pill" id="coords">—</span></div><div class="notice" id="toast"></div><section class="sheet" id="sheet" aria-label="操作面板"></section></main><nav class="toolbar" id="toolbar"><button class="tool active" data-tool="select"><b>⌖</b><span>選取</span></button><button class="tool" data-tool="unit"><b>▣</b><span>單位</span></button><button class="tool" data-tool="point"><b>●</b><span>標記</span></button><button class="tool" data-tool="line"><b>╱</b><span>線條</span></button><button class="tool" data-tool="arrow"><b>➜</b><span>箭頭</span></button><button class="tool" data-tool="route"><b>⋯</b><span>路線</span></button><button class="tool" data-tool="polygon"><b>⬡</b><span>區域</span></button><button class="tool" data-tool="circle"><b>◯</b><span>圓形</span></button><button class="tool" data-tool="text"><b>Ｔ</b><span>文字</span></button><button class="tool" data-tool="measure"><b>↔</b><span>量測</span></button><button class="tool" data-tool="layers"><b>▤</b><span>圖層</span></button><button class="tool" data-tool="terrain"><b>◉</b><span>通視</span></button></nav></div><input type="file" id="file" accept=".json,application/json" hidden>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORAGE='tactical-board-v2';let data=[],history=[],future=[],active='select',draft=[],selected=null,handles=[],preview=null,shapeLayer=L.layerGroup(),handleLayer=L.layerGroup(),tempLayer=L.layerGroup(),toastTimer,base='street',settings={side:'friendly',type:'步兵',echelon:'連',label:'',color:'#49a9ff',width:4,layer:'單位',radius:500},visible={},startCircle=null;
const layers=['單位','線條','區域','標記','文字','分析'];layers.forEach(l=>visible[l]=true);
const map=L.map('map',{zoomControl:false,preferCanvas:false,doubleClickZoom:false,zoomSnap:.5}).setView([24.45,118.38],11);shapeLayer.addTo(map);handleLayer.addTo(map);tempLayer.addTo(map);
const tiles={street:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}),satellite:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}),terrain:L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap · OpenStreetMap'})};tiles.street.addTo(map);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);const snap=()=>JSON.stringify(data);const clone=o=>JSON.parse(JSON.stringify(o));const coords=ll=>[+ll.lat.toFixed(6),+ll.lng.toFixed(6)];const ll=a=>L.latLng(a[0],a[1]);const dist=(a,b)=>map.distance(ll(a),ll(b));
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',2700)}
function record(){history.push(snap());if(history.length>70)history.shift();future=[]}function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({version:2,data,view:{center:coords(map.getCenter()),zoom:map.getZoom()},base}))}catch(e){toast('儲存空間不足，請匯出 JSON 備份')}}function commit(){persist();render()}function add(o){record();data.push({id:uid(),...o});commit()}function change(fn){record();fn();commit()}function undo(){if(!history.length)return;future.push(snap());data=JSON.parse(history.pop());selected=null;commit()}function redo(){if(!future.length)return;history.push(snap());data=JSON.parse(future.pop());selected=null;commit()}
function iconUnit(o){let side=o.side||'friendly',unit=o.type||'步兵';let glyph=({'步兵':'×','裝甲':'◯','砲兵':'●','通信':'⚡','工兵':'Ｅ','偵察':'◇','後勤':'＋','指揮所':'CP','防空':'⌁','其他':'·'})[unit]||'·';return L.divIcon({className:'',iconSize:[90,72],iconAnchor:[45,36],html:`<div class="symbolwrap"><div style="font-size:10px;color:#f2f6ff">${esc(o.echelon||'')}</div><div class="symbol ${side}" style="width:44px;height:30px"><span>${glyph}</span></div><div class="symboltext">${esc(o.label||unit)}</div></div>`})}
function layerOf(o){return o.layer||({unit:'單位',point:'標記',text:'文字',polygon:'區域',circle:'區域',los:'分析'}[o.kind]||'線條')}
function onFeature(o,feature){feature.on('click',e=>{if(active==='select'){L.DomEvent.stopPropagation(e);select(o.id)}});if(o.kind==='unit'||o.kind==='point'||o.kind==='text'){feature.on('dragend',()=>{let p=coords(feature.getLatLng());change(()=>{let x=data.find(x=>x.id===o.id);if(x)x.points=[p]})})}}
function render(){shapeLayer.clearLayers();handleLayer.clearLayers();handles=[];data.forEach(o=>{if(!visible[layerOf(o)])return;let pts=(o.points||[]).map(ll),c=o.color||'#4aa8ff',f;if(!pts.length)return;
if(o.kind==='unit')f=L.marker(pts[0],{icon:iconUnit(o),draggable:active==='select'});
else if(o.kind==='point')f=L.marker(pts[0],{draggable:active==='select',icon:L.divIcon({className:'',iconSize:[100,35],iconAnchor:[50,17],html:`<div class="marker-label" style="border-color:${esc(c)}">● ${esc(o.label||'標記')}</div>`})});
else if(o.kind==='text')f=L.marker(pts[0],{draggable:active==='select',icon:L.divIcon({className:'',iconSize:[130,35],iconAnchor:[65,17],html:`<div class="marker-label" style="border-color:${esc(c)};color:${esc(c)}">${esc(o.label||'文字')}</div>`})});
else if(o.kind==='circle')f=L.circle(pts[0],{radius:o.radius||500,color:c,weight:3,fillOpacity:.13});
else if(o.kind==='polygon')f=L.polygon(pts,{color:c,weight:o.width||3,fillOpacity:.16});
else {f=L.polyline(pts,{color:c,weight:o.width||4,dashArray:o.kind==='route'?'10 8':o.dashed?'10 8':null});if(o.kind==='arrow'&&pts.length>1){let a=map.latLngToLayerPoint(pts.at(-2)),b=map.latLngToLayerPoint(pts.at(-1)),angle=Math.atan2(b.y-a.y,b.x-a.x),len=18;let p1=L.point(b.x-len*Math.cos(angle-.5),b.y-len*Math.sin(angle-.5)),p2=L.point(b.x-len*Math.cos(angle+.5),b.y-len*Math.sin(angle+.5));let ah=L.polyline([map.layerPointToLatLng(p1),pts.at(-1),map.layerPointToLatLng(p2)],{color:c,weight:o.width||4,interactive:false}).addTo(shapeLayer)}}
f.addTo(shapeLayer);onFeature(o,f);if(o.label&&['line','arrow','route','polygon','circle','los'].includes(o.kind))f.bindTooltip(esc(o.label),{direction:'center',permanent:false});});
if(selected){let o=data.find(x=>x.id===selected);if(o&&visible[layerOf(o)]&&active==='select'&&['line','arrow','route','polygon','circle','los'].includes(o.kind)){o.points.forEach((p,i)=>{let m=L.marker(ll(p),{icon:L.divIcon({className:'handle',iconSize:[15,15],iconAnchor:[7,7]}),draggable:true}).addTo(handleLayer);m.on('dragend',()=>{let np=coords(m.getLatLng());change(()=>{let x=data.find(x=>x.id===o.id);x.points[i]=np})});handles.push(m)})}}}
function clearDraft(){draft=[];startCircle=null;tempLayer.clearLayers();$('#finish').style.display='none';$('#cancel').style.display='none'}function drawDraft(){tempLayer.clearLayers();if(draft.length){L.polyline(draft.map(ll),{color:'#ffd568',weight:3,dashArray:'7 5'}).addTo(tempLayer);draft.forEach(p=>L.circleMarker(ll(p),{radius:5,color:'#fff',fillColor:'#ffc45a',fillOpacity:1}).addTo(tempLayer))}$('#finish').style.display=draft.length?'block':'none';$('#cancel').style.display=draft.length?'block':'none'}
function setTool(t){if(t==='layers'){openLayers();return}if(t==='terrain'){openTerrain();return}active=t;selected=null;clearDraft();map.doubleClickZoom.disable();$('#toolbar').querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('#mode').textContent=({select:'選取 · 點選圖形編輯；拖曳符號移動',unit:'單位 · 點選地圖放置',point:'標記 · 點選地圖放置',line:'線條 · 依序點選，按 ✓ 完成',arrow:'箭頭 · 依序點選，按 ✓ 完成',route:'路線 · 依序點選，按 ✓ 完成',polygon:'區域 · 依序點選，按 ✓ 完成',circle:'圓形 · 先點中心，再點半徑',text:'文字 · 點選地圖放置',measure:'量測 · 點選兩點'})[t]||t;render();if(t==='unit')openUnit();else if(['line','arrow','route','polygon','circle','point','text'].includes(t))openStyle(t)}
function place(p){let a=coords(p);if(active==='select')return;if(['unit','point','text'].includes(active)){add({kind:active,points:[a],label:settings.label||({unit:settings.type,point:'標記',text:'文字'})[active],side:settings.side,type:settings.type,echelon:settings.echelon,color:settings.color,layer:layerOf({kind:active})});return}if(active==='circle'){if(!startCircle){startCircle=a;draft=[a];drawDraft();toast('再點一下決定圓形半徑')}else{let radius=dist(startCircle,a);if(radius<5)return toast('半徑太小');add({kind:'circle',points:[startCircle],radius,color:settings.color,label:settings.label,layer:'區域'});clearDraft()}return}draft.push(a);drawDraft();if(active==='measure'&&draft.length===2){let d=dist(draft[0],draft[1]);toast('距離：'+(d>=1000?(d/1000).toFixed(2)+' 公里':Math.round(d)+' 公尺'));clearDraft()}}
map.on('click',e=>{if($('#sheet').classList.contains('open'))closeSheet();place(e.latlng)});map.on('mousemove',e=>$('#coords').textContent=e.latlng.lat.toFixed(4)+', '+e.latlng.lng.toFixed(4));map.on('moveend zoomend',()=>{if(selected&&active==='select')render();persist()});
function finish(){let min=active==='polygon'?3:2;if(draft.length<min)return toast('至少需要 '+min+' 個節點');add({kind:active,points:clone(draft),label:settings.label,color:settings.color,width:settings.width,layer:active==='polygon'?'區域':'線條'});clearDraft()}
function openSheet(title,body){$('#sheet').innerHTML=`<div class="sheethead"><h2>${title}</h2><button class="iconbtn close" id="closeSheet">✕</button></div>${body}`;$('#sheet').classList.add('open');$('#closeSheet').onclick=closeSheet}function closeSheet(){$('#sheet').classList.remove('open')}
function field(label,id,value,type='text'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}
function selectField(label,id,values,current){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${values.map(v=>`<option value="${esc(v[0])}" ${v[0]===current?'selected':''}>${esc(v[1])}</option>`).join('')}</select></div>`}
const sideOpts=[['friendly','友軍（藍）'],['hostile','假想敵（紅）'],['neutral','中立（綠）'],['unknown','不明（黃）']];const unitTypes=['步兵','裝甲','砲兵','通信','工兵','偵察','後勤','指揮所','防空','其他'];const echelons=['班','排','連','營','旅','師','軍','其他'];
function openUnit(){openSheet('單位符號設定',selectField('識別', 'side',sideOpts,settings.side)+`<div class="grid2">${selectField('單位類型','type',unitTypes.map(x=>[x,x]),settings.type)}${selectField('編制階層','echelon',echelons.map(x=>[x,x]),settings.echelon)}</div>`+field('顯示名稱','label',settings.label)+`<p class="hint">設定後點選地圖放置。此為簡化教學符號，不代表完整 APP-6 標準。</p><div class="actions"><button class="btn primary" id="apply">套用並繪製</button></div>`);$('#apply').onclick=()=>{settings.side=$('#side').value;settings.type=$('#type').value;settings.echelon=$('#echelon').value;settings.label=$('#label').value;closeSheet();toast('點選地圖放置單位符號')}}
function openStyle(t){openSheet('繪圖設定',field('名稱／註記','label',settings.label)+`<div class="grid2">${field('線條／標記顏色','color',settings.color,'color')}${field('線條寬度（1–12）','width',settings.width,'number')}</div><p class="hint">${t==='polygon'?'點選至少三個頂點，按右側 ✓ 完成。':t==='circle'?'先點圓心，再點圓周。':t==='text'||t==='point'?'設定完成後，點選地圖放置。':'點選多個節點，按右側 ✓ 完成。'}</p><div class="actions"><button class="btn primary" id="apply">套用</button></div>`);$('#apply').onclick=()=>{settings.label=$('#label').value;settings.color=$('#color').value;settings.width=Math.min(12,Math.max(1,Number($('#width').value)||4));closeSheet()}}
function select(id){selected=id;render();let o=data.find(x=>x.id===id);if(!o)return;let canStyle=!['unit'].includes(o.kind);openSheet('編輯圖形',`<p class="hint">類型：${esc(o.kind)} · 圖層：${esc(layerOf(o))}<br>可拖曳點位或選取線條端點調整位置。</p>`+field('名稱','editLabel',o.label||'')+(canStyle?`<div class="grid2">${field('顏色','editColor',o.color||'#49a9ff','color')}${field('線寬','editWidth',o.width||4,'number')}</div>`:'')+(o.kind==='circle'?field('半徑（公尺）','editRadius',o.radius,'number'):'')+`<div class="actions"><button class="btn primary" id="editSave">儲存修改</button><button class="btn" id="duplicate">複製</button><button class="btn danger" id="delete">刪除</button></div>`);$('#editSave').onclick=()=>{change(()=>{let x=data.find(x=>x.id===id);x.label=$('#editLabel').value;if(canStyle){x.color=$('#editColor').value;x.width=Math.max(1,Number($('#editWidth').value)||4)}if(o.kind==='circle')x.radius=Math.max(1,Number($('#editRadius').value)||500)});closeSheet()};$('#duplicate').onclick=()=>{let copy=clone(o);delete copy.id;copy.points=copy.points.map(p=>[p[0]+.002,p[1]+.002]);add(copy);closeSheet();toast('已複製')};$('#delete').onclick=()=>{change(()=>data=data.filter(x=>x.id!==id));selected=null;closeSheet()}}
function openLayers(){openSheet('圖層管理',`<p class="hint">關閉圖層只會隱藏圖形，不會刪除。</p>`+layers.map(l=>`<label class="layerrow"><input type="checkbox" data-layer="${l}" ${visible[l]?'checked':''}><span>${l}</span><b>${data.filter(o=>layerOf(o)===l).length}</b></label>`).join('')+`<hr class="sep"><div class="actions"><button class="btn" id="allOn">全部顯示</button><button class="btn" id="allOff">全部隱藏</button></div>`);$('#sheet').querySelectorAll('[data-layer]').forEach(el=>el.onchange=()=>{visible[el.dataset.layer]=el.checked;render()});$('#allOn').onclick=()=>{layers.forEach(l=>visible[l]=true);render();openLayers()};$('#allOff').onclick=()=>{layers.forEach(l=>visible[l]=false);render();openLayers()}}
function exportJSON(){const blob=new Blob([JSON.stringify({format:'TacticalBoard2',version:2,created:new Date().toISOString(),data,view:{center:coords(map.getCenter()),zoom:map.getZoom()},base},null,2)],{type:'application/json'});download(blob,'tactical-board-'+new Date().toISOString().slice(0,10)+'.json')}
function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportPNG(){toast('正在製作圖片…');if(typeof html2canvas==='undefined'){toast('圖片工具未載入，請確認網路');return}closeSheet();html2canvas($('#map'),{useCORS:true,allowTaint:false,backgroundColor:'#e4e9ec',logging:false}).then(canvas=>canvas.toBlob(b=>b?download(b,'tactical-board.png'):toast('圖片匯出失敗'),'image/png')).catch(()=>toast('地圖圖磚跨來源限制，請使用 iPhone 截圖或匯出 JSON'))}
function sample(){if(data.length&&!confirm('載入教學範例將取代目前圖面，是否繼續？'))return;record();data=[{id:uid(),kind:'unit',points:[[24.46,118.36]],side:'friendly',type:'步兵',echelon:'連',label:'友軍 A',layer:'單位'},{id:uid(),kind:'unit',points:[[24.44,118.4]],side:'friendly',type:'裝甲',echelon:'排',label:'友軍 B',layer:'單位'},{id:uid(),kind:'unit',points:[[24.49,118.45]],side:'hostile',type:'步兵',echelon:'排',label:'假想敵',layer:'單位'},{id:uid(),kind:'arrow',points:[[24.46,118.36],[24.47,118.39],[24.49,118.44]],color:'#318cff',width:5,label:'教學進向',layer:'線條'},{id:uid(),kind:'polygon',points:[[24.48,118.43],[24.49,118.46],[24.5,118.45],[24.5,118.43]],color:'#e6ba55',label:'示意目標區',layer:'區域'}];selected=null;map.setView([24.47,118.4],12);commit();toast('已載入虛構教學範例')}
function openMenu(){openSheet('專案與地圖',`<div class="grid2"><button class="btn primary" id="export">↓ 匯出 JSON</button><button class="btn" id="import">↑ 匯入 JSON</button><button class="btn" id="png">▧ 匯出 PNG</button><button class="btn" id="example">◈ 教學範例</button></div><hr class="sep">${selectField('底圖','base',[['street','街道圖 OpenStreetMap'],['satellite','衛星影像 Esri'],['terrain','地形圖 OpenTopoMap']],base)}${selectField('快速定位','jump',[['','選擇地區'],['tw','臺灣'],['kinmen','金門'],['penghu','澎湖'],['matsu','馬祖']], '')}<div class="actions"><button class="btn" id="applyMap">套用地圖設定</button><button class="btn danger" id="clear">清空圖面</button></div><hr class="sep"><p class="hint">本程式為教學示意工具。圖面預設儲存在此瀏覽器；請定期匯出 JSON 備份。公開 GitHub Pages 網址可被他人瀏覽，不應放入敏感軍事資料。路線與高程查詢會向第三方服務傳送必要座標。</p><p class="hint">版本 2.0 · GitHub Pages 靜態網站 · 需要網路載入底圖及函式庫</p>`);$('#export').onclick=exportJSON;$('#import').onclick=()=>$('#file').click();$('#png').onclick=exportPNG;$('#example').onclick=sample;$('#applyMap').onclick=()=>{switchBase($('#base').value);let x=$('#jump').value,loc={tw:[[23.7,120.9],7],kinmen:[[24.45,118.38],11],penghu:[[23.57,119.57],11],matsu:[[26.16,119.95],11]};if(loc[x])map.setView(...loc[x]);closeSheet()};$('#clear').onclick=()=>{if(confirm('確定清空所有圖形？可按復原還原。')){change(()=>data=[]);selected=null;closeSheet()}}}
function switchBase(b){if(!tiles[b])return;map.removeLayer(tiles[base]);base=b;tiles[base].addTo(map);persist()}
$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let raw=JSON.parse(await f.text()),arr=Array.isArray(raw)?raw:raw.data;if(!Array.isArray(arr)||arr.length>3000||!arr.every(o=>o&&typeof o.kind==='string'&&Array.isArray(o.points)&&o.points.length<=1000&&o.points.every(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite))))throw Error('格式不正確或檔案過大');if(!confirm(`確定匯入 ${arr.length} 個圖形並取代目前圖面？`))return;record();data=arr.map(o=>({...o,id:uid(),label:String(o.label||'').slice(0,200),color:/^#[0-9a-f]{6}$/i.test(o.color)?o.color:'#4aa8ff'}));selected=null;if(raw.view?.center&&Number.isFinite(raw.view.zoom))map.setView(raw.view.center,raw.view.zoom);commit();closeSheet();toast('匯入成功')}catch(err){toast('無法匯入：'+err.message)}finally{e.target.value=''}};
// 點對點地形通視：公開 Terrarium 高程瓦片，僅供教學示意。
const elevCache=new Map();function mercator(lat,lng,z){let n=2**z,clamped=Math.max(-85.0511,Math.min(85.0511,lat));return {x:(lng+180)/360*n,y:(1-Math.asinh(Math.tan(clamped*Math.PI/180))/Math.PI)/2*n}}
async function elevation(p){const z=12,m=mercator(p[0],p[1],z),tx=Math.floor(m.x),ty=Math.floor(m.y),key=`${z}/${tx}/${ty}`;let pixels=elevCache.get(key);if(!pixels){let im=new Image();im.crossOrigin='anonymous';im.src=`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${key}.png`;await new Promise((res,rej)=>{im.onload=res;im.onerror=rej});let canvas=document.createElement('canvas');canvas.width=canvas.height=256;let ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);pixels=ctx.getImageData(0,0,256,256).data;elevCache.set(key,pixels);if(elevCache.size>80)elevCache.delete(elevCache.keys().next().value)}let px=Math.max(0,Math.min(255,Math.floor((m.x-tx)*256))),py=Math.max(0,Math.min(255,Math.floor((m.y-ty)*256))),i=(py*256+px)*4;return pixels[i]*256+pixels[i+1]+pixels[i+2]/256-32768}
function interpolate(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function openTerrain(){openSheet('點對點地形通視（教學）',`<p class="hint">先在地圖上放置兩個分析點。高程來自公開 Terrarium 資料，未考慮建築物、植被、氣象與地球曲率；不可作為實際軍事判斷依據。</p><div class="grid2">${field('觀察者高度（公尺）','obsH',2,'number')}${field('目標高度（公尺）','tgtH',2,'number')}</div><div class="actions"><button class="btn primary" id="startLOS">選取兩個點</button></div><div id="losResult" class="hint"></div>`);$('#startLOS').onclick=()=>{settings.obsH=Math.max(0,Number($('#obsH').value)||0);settings.tgtH=Math.max(0,Number($('#tgtH').value)||0);closeSheet();setTool('measure');active='los';$('#mode').textContent='通視 · 依序點選觀察點與目標點';toast('點選觀察點，再點選目標點')}}
async function analyzeLOS(a,b){let total=dist(a,b);if(total>15000){toast('教學通視距離上限 15 公里');return}toast('正在讀取地形高程…');try{let n=Math.min(90,Math.max(12,Math.ceil(total/80))),heights=[];for(let i=0;i<=n;i++){heights.push(await elevation(interpolate(a,b,i/n)))}let start=heights[0]+(settings.obsH||2),end=heights[n]+(settings.tgtH||2),maxBlock=-Infinity,blockIndex=-1;for(let i=1;i<n;i++){let expected=start+(end-start)*i/n,excess=heights[i]-expected;if(excess>maxBlock){maxBlock=excess;blockIndex=i}}let clear=maxBlock<=0,caption=`${clear?'地形剖面未發現遮蔽':'地形剖面可能遮蔽'}｜距離 ${(total/1000).toFixed(2)} 公里｜最大高差 ${maxBlock.toFixed(1)} 公尺`;add({kind:'los',points:[a,b],color:clear?'#45d5a0':'#ff9b66',width:4,label:caption,layer:'分析'});toast(caption);openSheet('通視分析結果',`<p><strong>${clear?'✓ 地形剖面未發現遮蔽':'! 地形剖面可能遮蔽'}</strong></p><p>距離：${(total/1000).toFixed(2)} 公里<br>起點高程：${heights[0].toFixed(1)} 公尺<br>終點高程：${heights[n].toFixed(1)} 公尺<br>最大遮蔽高差：${maxBlock.toFixed(1)} 公尺</p><p class="hint">此為簡化的取樣剖面測試，僅供地形教學，不包含曲率、折射、建物、植被及資料誤差。</p>`)}catch(err){toast('高程資料無法載入，請檢查網路或跨來源限制')}}
const originalPlace=place;place=function(p){let a=coords(p);if(active==='los'){draft.push(a);drawDraft();if(draft.length===2){let [x,y]=clone(draft);clearDraft();analyzeLOS(x,y)}return}originalPlace(p)};
$('#toolbar').onclick=e=>{let b=e.target.closest('[data-tool]');if(b)setTool(b.dataset.tool)};$('#plus').onclick=()=>map.zoomIn();$('#minus').onclick=()=>map.zoomOut();$('#finish').onclick=finish;$('#cancel').onclick=clearDraft;$('#undo').onclick=undo;$('#redo').onclick=redo;$('#save').onclick=()=>{persist();toast('已儲存在此瀏覽器；建議另匯出 JSON')};$('#menu').onclick=openMenu;document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();clearDraft()}if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();e.shiftKey?redo():undo()}if(e.key==='Enter'&&draft.length&&active!=='los')finish()});
try{let old=JSON.parse(localStorage.getItem(STORAGE)||'null');if(old&&Array.isArray(old.data)){data=old.data.filter(o=>o&&Array.isArray(o.points));if(old.view?.center)map.setView(old.view.center,old.view.zoom||11);if(tiles[old.base])switchBase(old.base)}}catch(e){}render();setTool('select');window.addEventListener('beforeunload',persist);
})();
</script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script></body></html>
