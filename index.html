<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Tactical Board 2.0</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#182538;--line:#314258;--txt:#edf4ff;--muted:#a9b8cd;--accent:#6aa9ff}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--txt)}button,input,select{font:inherit}button{border:1px solid var(--line);border-radius:12px;background:#26384f;color:var(--txt);min-height:44px;padding:8px 12px;cursor:pointer}button.active{background:#2460aa;border-color:#86baff}button:disabled{opacity:.4}#map{position:absolute;inset:0;z-index:0;background:#233b3d}.top{position:absolute;z-index:1000;top:env(safe-area-inset-top);left:8px;right:8px;display:flex;gap:6px;align-items:center;pointer-events:none}.top>*{pointer-events:auto}.brand{padding:11px 12px;background:#101827e8;border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:800;flex:1;white-space:nowrap}.top button{padding:8px}.bottom{position:absolute;z-index:1000;bottom:calc(8px + env(safe-area-inset-bottom));left:8px;right:8px;background:#101827f2;border:1px solid var(--line);border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.bottom button{padding:5px 1px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.bottom button span{font-size:20px}.sheet{position:absolute;z-index:1100;bottom:calc(90px + env(safe-area-inset-bottom));left:8px;right:8px;max-height:58vh;overflow:auto;background:#152236f7;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 12px 45px #0008;display:none}.sheet.open{display:block}.sheet h3{margin:0 0 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.row>*{flex:1}.row label{font-size:13px;color:var(--muted)}select,input{min-height:42px;background:#26384f;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px;max-width:100%}.item{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0}.item .name{flex:1;min-width:0}.item button{min-width:44px}.hint{font-size:12px;line-height:1.6;color:var(--muted)}.toast{position:absolute;z-index:1300;top:calc(65px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#101827ee;border:1px solid var(--line);padding:9px 13px;border-radius:10px;pointer-events:none;max-width:90%;text-align:center;font-size:13px;display:none}.leaflet-control-zoom{margin-top:80px!important}.leaflet-control-attribution{font-size:9px!important;margin-bottom:80px!important}.marker-label{background:#152236ee;color:#fff;border:1px solid #8dbaff;border-radius:7px;padding:3px 7px;white-space:nowrap;font-size:12px}.symbol{width:36px;height:30px;border:2px solid #60a5fa;background:#0b2545cc;color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;box-shadow:0 1px 5px #0008}.symbol.enemy{border-color:#f87171;background:#4b1717cc}.symbol.neutral{border-color:#4ade80;background:#123e2bcc}.symbol.unknown{border-color:#fbbf24;background:#493915cc}.cross{position:absolute;z-index:700;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;color:#fff;text-shadow:0 0 5px #000;font-size:22px;display:none}body.placing .cross{display:block}body.placing #map{cursor:crosshair}.leaflet-container{font-family:inherit}.small{font-size:12px}.danger{background:#69313b}.full{width:100%}@media(min-width:800px){.sheet{left:auto;width:380px;bottom:105px}.bottom{max-width:540px;left:50%;transform:translateX(-50%)}}
.unit-preview{display:flex;align-items:center;justify-content:center;min-height:105px;background:#111d2b;border:1px solid #36485e;border-radius:12px;margin:10px 0}.unit-marker{background:transparent;border:0}.unit-marker svg{display:block;touch-action:none}.sheet select,.sheet input{min-width:0}.sheet label{flex:1;min-width:0}button,select,input{font-size:16px} </style>
</head><body><div id="map"></div><div class="cross">＋</div><div class="top"><div class="brand">▣ TACTICAL BOARD 2.0</div><button id="undo" title="復原">↶</button><button id="redo" title="重做">↷</button><button id="save" title="儲存">💾</button></div><div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><h3 id="sheetTitle">工具</h3><div id="sheetBody"></div></div><nav class="bottom"><button data-tool="move" class="active"><span>✋</span>移動</button><button data-tool="symbols"><span>⬡</span>符號</button><button data-tool="draw"><span>✎</span>繪圖</button><button data-tool="layers"><span>▤</span>圖層</button><button data-tool="more"><span>⚙</span>更多</button></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{'use strict';
if(!window.L){document.getElementById('toast').textContent='地圖程式載入失敗，請確認網路連線後重新整理。';document.getElementById('toast').style.display='block';return;}
const $=id=>document.getElementById(id),toast=(s)=>{const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2600)};
const uid=()=>Math.random().toString(36).slice(2,10);const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([23.7,120.95],8);L.control.zoom({position:'topright'}).addTo(map);
const bases={road:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}),sat:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri and contributors'})};let base='road';bases[base].addTo(map);let layerDefs=[{id:'default',name:'主要圖層',visible:true,locked:false}];let activeLayer='default',features=[],mode='move',drawing=[],selected=null,history=[],future=[];const rendered=L.layerGroup().addTo(map);let drawPreview=L.layerGroup().addTo(map);
const clone=o=>JSON.parse(JSON.stringify(o));function snapshot(){history.push(clone({features,layerDefs,activeLayer}));if(history.length>50)history.shift();future=[]}function persist(){try{localStorage.setItem('tactical-board-v2',JSON.stringify({features,layerDefs,activeLayer,base,view:{center:map.getCenter(),zoom:map.getZoom()}}))}catch(e){toast('儲存失敗：瀏覽器空間不足')}}function restore(){try{const d=JSON.parse(localStorage.getItem('tactical-board-v2')||'null');if(!d)return;features=Array.isArray(d.features)?d.features:[];layerDefs=Array.isArray(d.layerDefs)&&d.layerDefs.length?d.layerDefs:layerDefs;activeLayer=layerDefs.some(x=>x.id===d.activeLayer)?d.activeLayer:layerDefs[0].id;if(d.base&&bases[d.base])setBase(d.base);if(d.view&&d.view.center)map.setView(d.view.center,d.view.zoom||8)}catch(e){toast('舊資料無法讀取，已使用空白專案')}}
function setBase(k){if(!bases[k])return;map.removeLayer(bases[base]);base=k;bases[base].addTo(map);persist()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function layerOf(f){return layerDefs.find(l=>l.id===f.layerId)}function color(f){return f.color||'#60a5fa'}

const UNIT_TYPES={infantry:['步兵','inf'],mechanized:['機械化步兵','mech'],armor:['裝甲兵','armor'],artillery:['砲兵','arty'],engineer:['工兵','eng'],signal:['通信兵','signal'],medical:['醫療','med'],recon:['偵察','recon'],airdefense:['防空','air'],logistics:['後勤','log'],hq:['指揮所','hq']};
const ECHELONS={team:'伍',squad:'班',platoon:'排',company:'連',battalion:'營',regiment:'團',brigade:'旅',division:'師',corps:'軍'};
const ECHELON_MARK={team:'●',squad:'●●',platoon:'●●●',company:'Ⅰ',battalion:'Ⅱ',regiment:'Ⅲ',brigade:'X',division:'XX',corps:'XXX'};
function unitSVG(f){const aff=f.affiliation||'friendly',palette={friendly:'#4da3ff',hostile:'#ff6666',neutral:'#55c998',unknown:'#e7ba57'},c=palette[aff]||palette.friendly;
let outline=aff==='hostile'?'<path d="M48 17 L92 43 L48 69 L4 43 Z"/>':aff==='neutral'?'<rect x="23" y="17" width="50" height="52"/>':aff==='unknown'?'<path d="M25 17 Q25 8 48 8 Q71 8 71 17 L71 67 Q71 76 48 76 Q25 76 25 67 Z"/>':'<rect x="8" y="20" width="80" height="46"/>';
const type=f.unitType||({ '✕':'infantry','●':'artillery','◆':'armor','⚙':'engineer','✚':'medical','⌁':'signal','★':'hq'}[f.symbol]||'infantry');
const sym={infantry:'<path d="M30 30 L66 56 M66 30 L30 56"/>',mechanized:'<path d="M30 30 L66 56 M66 30 L30 56"/><ellipse cx="48" cy="43" rx="17" ry="8"/>',armor:'<ellipse cx="48" cy="43" rx="20" ry="11"/>',artillery:'<circle cx="48" cy="43" r="11"/><circle cx="48" cy="43" r="2.5" fill="'+c+'" stroke="none"/>',engineer:'<path d="M35 55 L48 30 L61 55 M40 47 H56"/>',signal:'<path d="M35 54 Q22 43 35 32 M61 54 Q74 43 61 32 M48 31 V55"/>',medical:'<path d="M48 30 V56 M35 43 H61"/>',recon:'<path d="M30 50 L48 33 L66 50 M48 33 V56"/>',airdefense:'<path d="M30 55 L48 30 L66 55 M30 55 H66"/>',logistics:'<path d="M33 34 H63 V53 H33 Z M33 40 H63"/>',hq:'<path d="M48 28 V57 M36 40 H60"/>'}[type]||'<path d="M30 30 L66 56 M66 30 L30 56"/>';
const echelon=ECHELON_MARK[f.echelon||'company']||'Ⅰ';const size=Math.max(0.7,Math.min(2.2,Number(f.size)||1));
return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 88" width="${Math.round(96*size)}" height="${Math.round(88*size)}" role="img" aria-label="${esc(UNIT_TYPES[type]?.[0]||'部隊')}" style="overflow:visible;filter:drop-shadow(0 1px 2px #000a)"><g fill="${aff==='friendly'?'#102b44':aff==='hostile'?'#422023':'#1c2a2c'}" stroke="${c}" stroke-width="2.8" stroke-linejoin="round">${outline}</g><g fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${sym}</g><text x="48" y="13" text-anchor="middle" font-size="12" font-weight="800" fill="${c}">${echelon}</text></svg>`}
function unitOptions(selected){return Object.entries(UNIT_TYPES).map(([id,a])=>`<option value="${id}" ${id===selected?'selected':''}>${a[0]}</option>`).join('')}
function echelonOptions(selected){return Object.entries(ECHELONS).map(([id,name])=>`<option value="${id}" ${id===selected?'selected':''}>${name} (${ECHELON_MARK[id]})</option>`).join('')}
function affOptions(selected){return Object.entries({friendly:'友軍（藍）',hostile:'敵軍（紅）',neutral:'中立（綠）',unknown:'未知（黃）'}).map(([id,name])=>`<option value="${id}" ${id===selected?'selected':''}>${name}</option>`).join('')}
function bindUnitPreview(){const update=()=>{const f={unitType:$('unitType').value,echelon:$('echelon').value,affiliation:$('affiliation').value,size:Number($('unitSize').value)};$('unitPreview').innerHTML=unitSVG(f)};['unitType','echelon','affiliation','unitSize'].forEach(id=>$(id).addEventListener('input',update));update()}

function render(){rendered.clearLayers();for(const f of features){const ld=layerOf(f);if(!ld||!ld.visible)continue;let obj;if(f.type==='symbol'){const svg=unitSVG(f),size=Math.max(.7,Math.min(2.2,Number(f.size)||1)),w=Math.round(96*size),h=Math.round(88*size);const icon=L.divIcon({className:'unit-marker',html:svg,iconSize:[w,h],iconAnchor:[w/2,h/2]});obj=L.marker(f.points[0],{icon,draggable:!ld.locked&&mode==='move'});if(f.label)obj.bindTooltip(esc(f.label),{direction:'top',offset:[0,-14]});obj.on('dragstart',()=>snapshot());obj.on('dragend',e=>{f.points[0]=[e.target.getLatLng().lat,e.target.getLatLng().lng];persist()})}else if(f.type==='point'){obj=L.circleMarker(f.points[0],{radius:7,color:color(f),fillOpacity:.65})}else if(f.type==='polygon'){obj=L.polygon(f.points,{color:color(f),weight:3,fillOpacity:.16})}else{obj=L.polyline(f.points,{color:color(f),weight:3,dashArray:f.type==='dashed'?'9 8':undefined})}obj.on('click',e=>{if(mode==='move'){L.DomEvent.stopPropagation(e);selected=f.id;showSelected()}});obj.addTo(rendered)}persist()}
function openSheet(title,html){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('sheet').classList.add('open')}function closeSheet(){$('sheet').classList.remove('open')}function setMode(m){mode=m;drawing=[];drawPreview.clearLayers();document.body.classList.toggle('placing',m==='symbol'||m==='point'||m==='line'||m==='dashed'||m==='polygon');document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tool===m||(m==='symbol'&&b.dataset.tool==='symbols')||(['point','line','dashed','polygon'].includes(m)&&b.dataset.tool==='draw')))}
function showSelected(){const f=features.find(x=>x.id===selected);if(!f)return;const locked=layerOf(f)?.locked;
if(f.type==='symbol'){openSheet('編輯部隊符號',`<div class="hint">圖層：${esc(layerOf(f)?.name||'')} ${locked?'（已鎖定）':''}</div><div class="unit-preview" id="unitPreview"></div><div class="row"><label>兵種<select id="unitType" ${locked?'disabled':''}>${unitOptions(f.unitType||'infantry')}</select></label><label>部隊階層<select id="echelon" ${locked?'disabled':''}>${echelonOptions(f.echelon||'company')}</select></label></div><div class="row"><label>敵我識別<select id="affiliation" ${locked?'disabled':''}>${affOptions(f.affiliation||'friendly')}</select></label><label>大小<input id="unitSize" type="range" min="0.7" max="2.2" step="0.1" value="${Number(f.size)||1}" ${locked?'disabled':''}></label></div><div class="row"><label>名稱／編號<input id="editLabel" maxlength="100" value="${esc(f.label||'')}" ${locked?'disabled':''}></label></div><div class="row"><button id="editApply" ${locked?'disabled':''}>儲存修改</button><button id="editDuplicate" ${locked?'disabled':''}>複製</button><button id="editDelete" class="danger" ${locked?'disabled':''}>刪除</button></div><div class="hint">切換到「移動」後可拖曳未鎖定的部隊符號。所有符號位置均綁定地理座標。</div>`);bindUnitPreview();$('editApply').onclick=()=>{snapshot();Object.assign(f,{unitType:$('unitType').value,echelon:$('echelon').value,affiliation:$('affiliation').value,size:Number($('unitSize').value),label:$('editLabel').value});render();showSelected();toast('部隊符號已更新')};$('editDuplicate').onclick=()=>{snapshot();const n=clone(f);n.id=uid();n.points=[[f.points[0][0]+.001,f.points[0][1]+.001]];features.push(n);render();toast('已複製符號')};$('editDelete').onclick=()=>{snapshot();features=features.filter(x=>x.id!==f.id);render();closeSheet()};return}
openSheet('編輯圖形',`<div class="hint">類型：${esc(f.type)}</div><div class="row"><label>名稱<input id="editLabel" value="${esc(f.label||'')}" ${locked?'disabled':''}></label></div><div class="row"><label>顏色<input id="editColor" type="color" value="${/^#[0-9a-f]{6}$/i.test(color(f))?color(f):'#60a5fa'}" ${locked?'disabled':''}></label></div><div class="row"><button id="editApply" ${locked?'disabled':''}>套用</button><button id="editDelete" class="danger" ${locked?'disabled':''}>刪除</button></div>`);$('editApply').onclick=()=>{snapshot();f.label=$('editLabel').value;f.color=$('editColor').value;render();toast('已更新')};$('editDelete').onclick=()=>{snapshot();features=features.filter(x=>x.id!==f.id);render();closeSheet()}}
let unitType='infantry',echelon='company',affiliation='friendly',unitSize=1,drawingColor='#60a5fa';
function symbolsPanel(){openSheet('部隊符號庫｜SVG',`<div class="hint">教育示意符號，非正式國軍標準符號。先選屬性，再點擊地圖放置。</div><div class="unit-preview" id="unitPreview"></div><div class="row"><label>兵種<select id="unitType">${unitOptions(unitType)}</select></label><label>部隊階層<select id="echelon">${echelonOptions(echelon)}</select></label></div><div class="row"><label>敵我識別<select id="affiliation">${affOptions(affiliation)}</select></label><label>大小<input id="unitSize" type="range" min="0.7" max="2.2" step="0.1" value="${unitSize}"></label></div><div class="row"><label>名稱／編號<input id="symbolLabel" maxlength="100" placeholder="例如：第一連"></label></div><button id="placeSymbol" class="full">選擇完成 → 點擊地圖放置</button>`);bindUnitPreview();$('placeSymbol').onclick=()=>{if(!canEdit())return;unitType=$('unitType').value;echelon=$('echelon').value;affiliation=$('affiliation').value;unitSize=Number($('unitSize').value);window.pendingLabel=$('symbolLabel').value;setMode('symbol');closeSheet();toast('請點擊地圖放置部隊符號')}}
function drawPanel(){openSheet('基本戰術繪圖',`<div class="hint">選擇圖形後，在地圖逐點點擊。折線／區域可按「完成」結束。</div><div class="row"><label>線條顏色<input id="drawColor" type="color" value="${drawingColor}"></label></div><div class="row"><button data-shape="point">● 點位</button><button data-shape="line">／ 實線</button><button data-shape="dashed">┄ 虛線</button><button data-shape="polygon">▱ 區域</button></div><div class="row"><button id="finishDraw">完成繪製</button><button id="cancelDraw">取消</button></div>`);document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{if(!canEdit())return;drawingColor=$('drawColor').value;setMode(b.dataset.shape);toast('點擊地圖加入節點')});$('finishDraw').onclick=finishDraw;$('cancelDraw').onclick=()=>{setMode('move');toast('已取消繪圖')}}function canEdit(){if(layerDefs.find(x=>x.id===activeLayer)?.locked){toast('目前圖層已鎖定');return false}return true}
function finishDraw(){const minimum=mode==='polygon'?3:2;if(!['line','dashed','polygon'].includes(mode)||drawing.length<minimum){toast('節點不足，請繼續點擊地圖');return}snapshot();features.push({id:uid(),type:mode,points:clone(drawing),layerId:activeLayer,color:drawingColor});setMode('move');render();closeSheet();toast('繪圖已完成')}
function layersPanel(){const html=`<div class="row"><button id="addLayer">＋ 新增圖層</button></div>`+layerDefs.map((l,i)=>`<div class="item"><input type="radio" name="activeLayer" value="${esc(l.id)}" ${l.id===activeLayer?'checked':''} aria-label="選取圖層"><span class="name">${esc(l.name)}</span><button data-vis="${esc(l.id)}" title="顯示或隱藏">${l.visible?'👁':'◌'}</button><button data-lock="${esc(l.id)}" title="鎖定">${l.locked?'🔒':'🔓'}</button><button data-up="${esc(l.id)}" title="上移">↑</button></div>`).join('')+`<div class="hint">選取圓點可設定新圖形所屬圖層；圖層可顯示、隱藏、鎖定及調整順序。</div>`;openSheet('圖層管理',html);$('addLayer').onclick=()=>{const name=prompt('新圖層名稱','新圖層');if(!name)return;snapshot();const id=uid();layerDefs.push({id,name,visible:true,locked:false});activeLayer=id;render();layersPanel()};document.querySelectorAll('[name=activeLayer]').forEach(el=>el.onchange=()=>{activeLayer=el.value;persist()});document.querySelectorAll('[data-vis]').forEach(el=>el.onclick=()=>{snapshot();const l=layerDefs.find(x=>x.id===el.dataset.vis);l.visible=!l.visible;render();layersPanel()});document.querySelectorAll('[data-lock]').forEach(el=>el.onclick=()=>{snapshot();const l=layerDefs.find(x=>x.id===el.dataset.lock);l.locked=!l.locked;render();layersPanel()});document.querySelectorAll('[data-up]').forEach(el=>el.onclick=()=>{const i=layerDefs.findIndex(x=>x.id===el.dataset.up);if(i<1)return;snapshot();[layerDefs[i-1],layerDefs[i]]=[layerDefs[i],layerDefs[i-1]];render();layersPanel()})}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}function morePanel(){openSheet('地圖與專案',`<div class="row"><button id="road">🗺 道路地圖</button><button id="sat">🛰 衛星影像</button></div><div class="row"><button id="locate">◎ 定位</button><button id="export">⬇ 匯出 JSON</button></div><div class="row"><button id="import">⬆ 匯入 JSON</button><button id="clear" class="danger">清空圖形</button></div><input type="file" id="fileInput" accept=".json,application/json" style="display:none"><div class="hint">使用網路地圖需要連線。衛星影像由 Esri 提供，道路圖由 OpenStreetMap 圖磚服務提供；請遵守供應商使用政策。專案資料僅儲存於目前瀏覽器，建議定期匯出備份。</div>`);$('road').onclick=()=>{setBase('road');toast('已切換道路圖')};$('sat').onclick=()=>{setBase('sat');toast('已切換衛星圖')};$('locate').onclick=()=>{map.locate({setView:true,maxZoom:15,enableHighAccuracy:true});toast('正在取得定位，請允許位置權限')};$('export').onclick=()=>{download('tactical-board-project.json',JSON.stringify({version:2,features,layerDefs,activeLayer,base,view:{center:map.getCenter(),zoom:map.getZoom()}},null,2),'application/json');toast('已建立備份檔')};$('import').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.features)||!Array.isArray(d.layerDefs)||!d.layerDefs.length||d.features.length>10000||d.layerDefs.length>500)throw Error('格式不符');for(const x of d.features){if(!x||!['symbol','point','line','dashed','polygon'].includes(x.type)||!Array.isArray(x.points)||x.points.length>10000||!x.points.every(p=>Array.isArray(p)&&p.length===2&&p.every(v=>typeof v==='number'&&Number.isFinite(v)&&Math.abs(v)<=180)))throw Error('圖形資料無效')}if(!d.layerDefs.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string'))throw Error('圖層資料無效');snapshot();features=d.features;layerDefs=d.layerDefs;activeLayer=layerDefs.some(x=>x.id===d.activeLayer)?d.activeLayer:layerDefs[0].id;if(d.base&&bases[d.base])setBase(d.base);if(d.view&&d.view.center&&Number.isFinite(d.view.center.lat)&&Number.isFinite(d.view.center.lng))map.setView([d.view.center.lat,d.view.center.lng],Math.max(2,Math.min(19,Number(d.view.zoom)||8)));render();toast('匯入成功')}catch(err){toast('匯入失敗：'+err.message)}};$('clear').onclick=()=>{if(!confirm('確定清空所有繪圖圖形？'))return;snapshot();features=[];render();toast('已清空')}}
map.on('click',e=>{if(!canEdit()&&mode!=='move')return;if(mode==='symbol'){snapshot();features.push({id:uid(),type:'symbol',points:[[e.latlng.lat,e.latlng.lng]],layerId:activeLayer,unitType,echelon,affiliation,size:unitSize,label:window.pendingLabel||''});render();toast('符號已放置')}else if(mode==='point'){snapshot();features.push({id:uid(),type:'point',points:[[e.latlng.lat,e.latlng.lng]],layerId:activeLayer,color:drawingColor});render();toast('點位已放置')}else if(['line','dashed','polygon'].includes(mode)){drawing.push([e.latlng.lat,e.latlng.lng]);drawPreview.clearLayers();L.polyline(drawing,{color:drawingColor,weight:3}).addTo(drawPreview);drawing.forEach(p=>L.circleMarker(p,{radius:4,color:'#fff'}).addTo(drawPreview));toast(`已加入 ${drawing.length} 個節點`)}});map.on('locationerror',()=>toast('無法取得定位，請檢查 Safari 權限'));
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{const t=b.dataset.tool;if(t==='move'){setMode('move');closeSheet()}else if(t==='symbols'){setMode('move');symbolsPanel()}else if(t==='draw'){setMode('move');drawPanel()}else if(t==='layers'){setMode('move');layersPanel()}else{setMode('move');morePanel()}});function applyState(s){features=s.features;layerDefs=s.layerDefs;activeLayer=s.activeLayer;render()}$('undo').onclick=()=>{if(!history.length)return;future.push(clone({features,layerDefs,activeLayer}));applyState(history.pop());toast('已復原')};$('redo').onclick=()=>{if(!future.length)return;history.push(clone({features,layerDefs,activeLayer}));applyState(future.pop());toast('已重做')};$('save').onclick=()=>{persist();toast('已儲存至本機瀏覽器')};map.on('moveend',persist);restore();render();toast('Tactical Board 2.0 已就緒');
})();
</script></body></html>
