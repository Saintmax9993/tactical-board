<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101a2a"><title>Tactical Board 2.0 台灣兵棋繪圖板</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#edf4ff;background:#0e1725;--panel:#142237;--edge:#34465f;--accent:#72b8ff}*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;background:#243752;border:1px solid #405672;border-radius:10px;color:#fff;padding:9px 11px;min-height:42px}button.active{background:#2766a1;border-color:#83c6ff}button:disabled{opacity:.35}input,select{background:#0e1b2e;border:1px solid #415772;border-radius:8px;color:white;padding:9px;width:100%;min-height:42px}label{font-size:12px;color:#aabbd2;display:block;margin:8px 0 4px}.shell{position:fixed;inset:0}.leaflet-container{background:#0a1923}.leaflet-control-attribution{font-size:9px!important}.header{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:linear-gradient(#101a2af2,#101a2add);border-bottom:1px solid var(--edge)}.brand{font-size:15px;font-weight:750;white-space:nowrap;margin-right:auto}.brand small{display:block;font-size:10px;font-weight:400;color:#9eb2cb}.header button{padding:7px 10px;min-height:36px}.panel{position:absolute;z-index:900;background:#142237f5;box-shadow:0 12px 35px #0006;border:1px solid var(--edge);overflow:auto}.tools{left:12px;top:88px;bottom:14px;width:300px;border-radius:14px;padding:12px}.layers{right:12px;top:88px;width:236px;max-height:calc(100% - 108px);border-radius:14px;padding:12px}.section{font-weight:700;font-size:13px;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center}.row{display:flex;gap:6px;align-items:center}.row>*{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid button{font-size:12px;min-height:48px;padding:5px}.divider{height:1px;background:#34465f;margin:13px 0}.muted{font-size:11px;color:#9fb3ce;line-height:1.5}.layer{display:flex;align-items:center;gap:6px;background:#1b2d45;border:1px solid #354b67;border-radius:9px;margin:6px 0;padding:5px}.layer.current{border-color:#77baff}.layer .name{flex:1;font-size:12px;cursor:pointer;overflow:hidden;text-overflow:ellipsis}.layer button{padding:4px;min-height:32px;min-width:32px}.layer.off{opacity:.55}.footer{position:absolute;z-index:850;bottom:10px;left:50%;transform:translateX(-50%);background:#13233ce8;padding:8px 12px;border:1px solid #39516d;border-radius:11px;font-size:12px;pointer-events:none;text-align:center}.symbol-preview{background:#0b1829;border:1px solid #354b67;border-radius:9px;display:flex;align-items:center;justify-content:center;height:74px;margin-top:8px}.symbol-preview svg{width:120px;height:65px}.mobile-tabs{display:none}.selected-note{font-size:12px;color:#b8cce3;padding:6px 0}.leaflet-div-icon.unit-icon{background:transparent;border:0}.unit-icon svg{overflow:visible;filter:drop-shadow(0 2px 2px #0008)}.vertex{border:2px solid white;background:#2686f0;border-radius:50%;width:14px;height:14px}.hidden{display:none!important}@media(max-width:800px){.brand{font-size:13px}.brand small{font-size:9px}.header{gap:5px;padding-left:8px;padding-right:8px}.header button{font-size:11px;padding:6px}.tools{left:0;right:0;top:auto;bottom:calc(60px + env(safe-area-inset-bottom));width:auto;height:238px;border-radius:17px 17px 0 0;padding:12px;box-shadow:0 -12px 28px #0006}.tools.collapsed{display:none}.layers{right:8px;left:8px;top:calc(57px + env(safe-area-inset-top));width:auto;max-height:180px;padding:9px;border-radius:12px}.layers .layer-list{display:flex;overflow-x:auto;gap:5px}.layers .layer{flex:0 0 auto;min-width:145px;margin:2px 0}.layers .section{margin-bottom:3px}.mobile-tabs{display:flex;position:absolute;z-index:1000;bottom:0;left:0;right:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));gap:6px;background:#111e31;border-top:1px solid #40526c}.mobile-tabs button{flex:1;font-size:12px;padding:6px 3px}.footer{bottom:calc(68px + env(safe-area-inset-bottom));font-size:10px;max-width:90%;white-space:nowrap}.tools .grid{grid-template-columns:repeat(4,1fr)}.tools .grid button{min-height:39px}.tools .divider{margin:9px 0}.tools .section{margin-bottom:5px}}@media(min-width:801px){.tools,.layers{display:block!important}}
</style></head><body><div class="shell"><div id="map"></div><header class="header"><div class="brand">▣ TACTICAL BOARD 2.0 · NATO<small>NATO APP-6 風格｜衛星＋道路名稱</small></div><button id="undo" title="復原">↶</button><button id="redo" title="重做">↷</button><button id="save">儲存</button><button id="export">匯出</button><button id="import">匯入</button><input id="file" type="file" accept="application/json,.json" hidden></header><aside class="panel tools" id="tools"><div class="section">繪圖工具 <span id="modeLabel" class="muted">選取模式</span></div><div class="grid" id="modes"><button data-mode="select" class="active">☝ 選取</button><button data-mode="unit">▣ 兵棋符號</button><button data-mode="arrow">➜ 方向箭頭</button><button data-mode="line">／ 實線</button><button data-mode="dash">┄ 虛線</button><button data-mode="polygon">⬡ 區域</button><button data-mode="defense">⌁ 防禦線</button><button id="finish">✓ 完成</button></div><div class="divider"></div><div id="unitSettings"><div class="section">NATO 部隊符號設定</div><label>兵種</label><select id="branch"><option value="inf">步兵</option><option value="mech">機械化步兵</option><option value="armor">裝甲兵</option><option value="arty">砲兵</option><option value="eng">工兵</option><option value="signal">通信兵</option><option value="recon">偵察</option><option value="airdef">防空</option><option value="medical">醫療</option><option value="log">後勤</option><option value="hq">指揮所</option></select><div class="row"><div><label>部隊階層</label><select id="echelon"><option value="team">伍</option><option value="squad">班</option><option value="platoon">排</option><option value="company" selected>連</option><option value="battalion">營</option><option value="regiment">團</option><option value="brigade">旅</option><option value="division">師</option><option value="corps">軍</option></select></div><div><label>敵我識別</label><select id="affiliation"><option value="friend">友軍</option><option value="hostile">敵軍</option><option value="neutral">中立</option><option value="unknown">未知</option></select></div></div><label>單位名稱／註記</label><input id="unitName" placeholder="例如：第一連" maxlength="50"><div class="symbol-preview" id="preview"></div></div><div class="divider"></div><div class="section">物件編輯</div><div id="selectedInfo" class="selected-note">尚未選取物件</div><div class="row"><button id="apply">套用符號設定</button><button id="duplicate">複製</button><button id="delete">刪除</button></div><p class="muted">符號採 NATO APP-6 風格示意，尚非正式規範驗證版本。選取符號後可拖曳移動；選取線條／區域後可拖曳藍色節點。繪製折線或區域時，逐點點擊地圖，再按「完成」。</p></aside><aside class="panel layers" id="layers"><div class="section">圖層管理 <button id="addLayer">＋ 圖層</button></div><div id="layerList" class="layer-list"></div></aside><div class="footer" id="hint">點選符號或圖形可編輯，地圖以台灣為中心</div><nav class="mobile-tabs"><button id="tabMap" class="active">🗺 地圖</button><button id="tabUnit">▣ 符號</button><button id="tabDraw">✎ 圖形</button><button id="tabLayer">▤ 圖層</button></nav></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id), mobile=()=>matchMedia('(max-width:800px)').matches;const bounds=L.latLngBounds([20.4,116.0],[27.0,123.2]);const map=L.map('map',{center:[23.75,120.9],zoom:7,minZoom:6,maxZoom:18,maxBounds:bounds.pad(.12),maxBoundsViscosity:1,zoomControl:false});L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Imagery © Esri and contributors',maxZoom:18}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',attribution:'Labels © CARTO, © OpenStreetMap contributors',maxZoom:19,pane:'overlayPane',opacity:1}).addTo(map);const branchNames={inf:'步兵',mech:'機步',armor:'裝甲',arty:'砲兵',eng:'工兵',signal:'通信',recon:'偵察',airdef:'防空',medical:'醫療',log:'後勤',hq:'指揮所'}, ranks={team:'Ø',squad:'●●',platoon:'●●●',company:'Ⅰ',battalion:'Ⅱ',regiment:'Ⅲ',brigade:'X',division:'XX',corps:'XXX'},colors={friend:'#64b3ff',hostile:'#ff6e71',neutral:'#69d2a2',unknown:'#ffd46a'};let state={layers:[{id:'a',name:'部隊符號',visible:true,locked:false},{id:'b',name:'戰術圖形',visible:true,locked:false}],active:'a',objects:[]},mode='select',selected=null,pending=[],history=[],future=[],rendered=[],handles=[];const uid=()=>Math.random().toString(36).slice(2,10);const clone=x=>JSON.parse(JSON.stringify(x));const layer=id=>state.layers.find(l=>l.id===id);const snap=()=>{history.push(JSON.stringify(state));if(history.length>80)history.shift();future=[]};const store=()=>{try{localStorage.setItem('tb2-taiwan-v1',JSON.stringify(state))}catch(e){}};const message=s=>$('hint').textContent=s;const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function svg(branch,echelon,affiliation,name=''){
// APP-6-inspired public unclassified tactical iconography. Not a certified APP-6 edition implementation.
const color=colors[affiliation]||colors.friend;
const frame=affiliation==='hostile'?'<path d="M60 22L108 49L60 76L12 49Z"/>':affiliation==='neutral'?'<rect x="33" y="21" width="54" height="56"/>':affiliation==='unknown'?'<path d="M36 22Q22 22 22 39V60Q22 77 39 77H81Q98 77 98 60V39Q98 22 84 22Z"/>':'<rect x="13" y="26" width="94" height="47"/>';
const marks={inf:'<path d="M39 36L81 62M81 36L39 62"/>',mech:'<path d="M39 36L81 62M81 36L39 62"/><ellipse cx="60" cy="49" rx="20" ry="9"/>',armor:'<ellipse cx="60" cy="49" rx="24" ry="12"/>',arty:'<circle cx="60" cy="49" r="13"/><circle cx="60" cy="49" r="3" fill="'+color+'"/>',eng:'<text x="60" y="58" font-size="28" text-anchor="middle" fill="'+color+'" stroke="none">E</text>',signal:'<path d="M38 62L60 36L82 62M39 36L81 62"/>',recon:'<path d="M38 49L60 35L82 49L60 63Z"/>',airdef:'<path d="M35 62Q60 20 85 62M60 30V66"/>',medical:'<path d="M55 35H65V44H74V54H65V63H55V54H46V44H55Z"/>',log:'<text x="60" y="55" font-size="17" text-anchor="middle" fill="'+color+'" stroke="none">LOG</text>',hq:'<path d="M60 73V88"/><text x="60" y="55" font-size="17" text-anchor="middle" fill="'+color+'" stroke="none">CP</text>'};
return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 112" width="120" height="112" role="img" aria-label="${safe(branchNames[branch])}"><g fill="rgba(12,24,39,.88)" stroke="${color}" stroke-width="3" stroke-linejoin="round">${frame}</g><g fill="none" stroke="${color}" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">${marks[branch]||''}</g><text x="60" y="15" text-anchor="middle" fill="${color}" font-size="13" font-weight="bold">${ranks[echelon]||''}</text><text x="60" y="106" text-anchor="middle" fill="white" stroke="#101a2a" stroke-width="2.5" paint-order="stroke" font-size="11" font-weight="600">${safe(name).slice(0,18)}</text></svg>`}
function settings(){return {branch:$('branch').value,echelon:$('echelon').value,affiliation:$('affiliation').value,name:$('unitName').value.trim()}}function preview(){$('preview').innerHTML=svg(...Object.values(settings()))}['branch','echelon','affiliation','unitName'].forEach(id=>$(id).addEventListener('input',preview));preview();function activeLayer(){let l=layer(state.active);return l&&!l.locked?l:null}function setMode(m){mode=m;pending=[];selected=null;render();$('modeLabel').textContent={select:'選取／拖曳',unit:'點地圖放置符號',arrow:'點選箭頭起點與終點',line:'逐點繪製實線',dash:'逐點繪製虛線',polygon:'逐點繪製區域',defense:'逐點繪製防禦線'}[m];document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));message($('modeLabel').textContent)}function removeRendered(){rendered.forEach(x=>map.removeLayer(x));handles.forEach(x=>map.removeLayer(x));rendered=[];handles=[]}function icon(o){return L.divIcon({className:'unit-icon',html:svg(o.branch,o.echelon,o.affiliation,o.name),iconSize:[80,75],iconAnchor:[40,38]})}function render(){removeRendered();for(const o of state.objects){let l=layer(o.layer);if(!l||!l.visible)continue;let item;if(o.type==='unit'){item=L.marker(o.coords,{icon:icon(o),draggable:!l.locked&&mode==='select'});item.on('dragstart',()=>{snap()});item.on('dragend',()=>{o.coords=[item.getLatLng().lat,item.getLatLng().lng];store();render()})}else{let opts={color:o.type==='defense'?'#ffcc70':'#73baff',weight:o.id===selected?5:3,opacity:.95,dashArray:o.type==='dash'?'9,7':o.type==='defense'?'14,5,3,5':null};item=o.type==='polygon'?L.polygon(o.coords,{...opts,fillColor:'#67aaf0',fillOpacity:.17}):L.polyline(o.coords,opts)}item.addTo(map);item.on('click',e=>{if(mode==='select'){L.DomEvent.stopPropagation(e);selected=o.id;loadSelected(o);render()}});rendered.push(item);if(o.id===selected&&o.type!=='unit'&&!l.locked&&mode==='select'){o.coords.forEach((p,i)=>{let h=L.marker(p,{icon:L.divIcon({className:'vertex',iconSize:[14,14]}),draggable:true});h.on('dragstart',()=>snap());h.on('dragend',()=>{let q=h.getLatLng();o.coords[i]=[q.lat,q.lng];store();render()});h.addTo(map);handles.push(h)})}}renderLayers();$('selectedInfo').textContent=selected?`已選取：${state.objects.find(x=>x.id===selected)?.type==='unit'?'部隊符號':'戰術圖形'}`:'尚未選取物件'}function renderLayers(){let root=$('layerList');root.innerHTML='';state.layers.forEach(l=>{let div=document.createElement('div');div.className='layer'+(l.id===state.active?' current':'')+(!l.visible?' off':'');let name=document.createElement('span');name.className='name';name.textContent=l.name;name.onclick=()=>{state.active=l.id;renderLayers()};let eye=document.createElement('button');eye.textContent=l.visible?'◉':'◌';eye.title='顯示／隱藏';eye.onclick=()=>{snap();l.visible=!l.visible;store();render()};let lock=document.createElement('button');lock.textContent=l.locked?'🔒':'🔓';lock.title='鎖定／解鎖';lock.onclick=()=>{snap();l.locked=!l.locked;store();render()};div.append(name,eye,lock);root.append(div)})}function loadSelected(o){state.active=o.layer;if(o.type==='unit'){['branch','echelon','affiliation'].forEach(k=>$(k).value=o[k]);$('unitName').value=o.name||'';preview()}renderLayers()}function commitObject(o){snap();state.objects.push(o);selected=o.id;store();render()}function finish(){if(!pending.length)return;if(pending.length<(mode==='polygon'?3:2)){message('節點不足，請繼續點擊地圖');return}let l=activeLayer();if(!l){message('請選擇未鎖定圖層');return}commitObject({id:uid(),layer:l.id,type:mode,coords:clone(pending)});pending=[];message('圖形已完成');setMode('select')}map.on('click',e=>{if(mode==='select'){selected=null;render();return}let l=activeLayer();if(!l){message('目前圖層已鎖定，請切換圖層');return}if(mode==='unit'){let s=settings();commitObject({id:uid(),layer:l.id,type:'unit',coords:[e.latlng.lat,e.latlng.lng],...s});message('符號已放置，可繼續點擊放置');return}pending.push([e.latlng.lat,e.latlng.lng]);if(mode==='arrow'&&pending.length===2){finish();return}message(`已放置 ${pending.length} 個節點，按「完成」結束`)});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('finish').onclick=finish;$('apply').onclick=()=>{let o=state.objects.find(x=>x.id===selected);if(!o||o.type!=='unit')return;let l=layer(o.layer);if(l?.locked)return message('圖層已鎖定');snap();Object.assign(o,settings());store();render();message('已更新符號')};$('delete').onclick=()=>{if(!selected)return;let o=state.objects.find(x=>x.id===selected);if(layer(o.layer)?.locked)return; snap();state.objects=state.objects.filter(x=>x.id!==selected);selected=null;store();render()};$('duplicate').onclick=()=>{let o=state.objects.find(x=>x.id===selected);if(!o||layer(o.layer)?.locked)return;snap();let copy=clone(o);copy.id=uid();if(o.type==='unit')copy.coords=[o.coords[0]+.01,o.coords[1]+.01];else copy.coords=o.coords.map(p=>[p[0]+.01,p[1]+.01]);state.objects.push(copy);selected=copy.id;store();render()};$('addLayer').onclick=()=>{let name=prompt('新圖層名稱','新圖層');if(!name)return;snap();let id=uid();state.layers.push({id,name:name.slice(0,40),visible:true,locked:false});state.active=id;store();render()};$('undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify(state));state=JSON.parse(history.pop());selected=null;store();render()};$('redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify(state));state=JSON.parse(future.pop());selected=null;store();render()};$('save').onclick=()=>{store();message('已儲存到此瀏覽器')};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'Tactical Board 2.0',version:1,state},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='tactical-board-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text()),s=j.state||j;if(!Array.isArray(s.layers)||!Array.isArray(s.objects)||!s.layers.every(x=>typeof x.id==='string'&&typeof x.name==='string')||!s.objects.every(x=>typeof x.id==='string'&&Array.isArray(x.coords)&&['unit','arrow','line','dash','polygon','defense'].includes(x.type)))throw Error('檔案結構不正確');snap();state=s;state.active=layer(state.active)?state.active:state.layers[0]?.id;selected=null;store();render();message('專案已匯入')}catch(err){alert('無法匯入：'+err.message)}e.target.value=''};function mobilePanel(tab){if(!mobile())return;let showTools=tab==='unit'||tab==='draw';$('tools').classList.toggle('collapsed',!showTools);$('layers').classList.toggle('hidden',tab!=='layer');document.querySelectorAll('.mobile-tabs button').forEach(b=>b.classList.remove('active'));$('tab'+tab[0].toUpperCase()+tab.slice(1)).classList.add('active');if(tab==='unit')setMode('unit');if(tab==='draw')setMode('line');if(tab==='map'||tab==='layer')setMode('select');setTimeout(()=>map.invalidateSize(),100)}['Map','Unit','Draw','Layer'].forEach(t=>$('tab'+t).onclick=()=>mobilePanel(t.toLowerCase()));try{let saved=JSON.parse(localStorage.getItem('tb2-taiwan-v1'));if(saved&&Array.isArray(saved.layers)&&Array.isArray(saved.objects))state=saved}catch(e){}render();if(mobile())mobilePanel('map');window.addEventListener('resize',()=>{if(!mobile()){$('tools').classList.remove('collapsed');$('layers').classList.remove('hidden')}map.invalidateSize()});window.addEventListener('beforeunload',store);})();
</script></body></html>
